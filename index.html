
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuvisco</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1d26, #143642);
      color: #f2f2f2;
    }

    .container {
      background: rgba(0, 0, 0, 0.55);
      padding: 28px 32px;
      border-radius: 18px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 1.7rem;
      margin-bottom: 14px;
    }

    p {
      font-size: 1rem;
      line-height: 1.55;
      margin: 10px 0;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 16px 0;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐈 Chuvisco</h1>

    <p>Se tu achou isso, tu deve ser um turista.</p>
    <p>Esse é meu gato, <strong>Chuvisco</strong>.</p>
    <p>Ele vive se perdendo.</p>

    <div class="divider"></div>

    <p>Leva ele até a casa de madeira azul perto da praia, aquela que tem uma bandeira do Grêmio em cima.</p>

    <div class="footer">Capão da Canoa · RS</div>
  </div>
</body>
</html>
